services:
  - type: web
    name: sm-academia-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_CHAT_IDS
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: PORT
        value: 10000
